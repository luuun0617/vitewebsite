<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>index</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  </head>
  <body>
    <%- include('./layout/header'); -%>

    <main class="container">
      <div class="row py-64 py-md-0 justify-center">
        <div class="col-6 col-md-4">
          <div class=" d-flex justify-center mb-32 mb-md-24">
            <div class="check-mark me-16 me-md-8">
              <i class="bi bi-check-lg"></i>                       
            </div>
            <h1 class="h3 h4-md">我的收藏</h3>
          </div>
          <div class="time d-flex text-primary-400 mb-32">
            <i class="bi bi-truck me-12"></i>
            <div class="d-flex flex-md-column ta-md-left">
              <p class="md">門市營業時間：</p>
              <p class="md">週一至週五 10:00 - 22:00</p>
            </div>
          </div>
          <div class="d-flex section-lined mb-32">
            <img src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week2/product.png?raw=true" alt="product" class="detail-img me-16 mb-32">
            <div class="w-100">
              <p class="h5 h6-md mb-8 like-detail">PLATFORM 404</p>
              <div class="d-flex">
                <ul class="md sm text-neutral-600 me-12">
                  <li class="mb-8">尺寸</li>
                  <li class="mb-8">顏色</li>
                </ul>
                <ul class="md sm text-neutral-900">
                  <li class="mb-8">38</li>
                  <li>Navy</li>
                </ul>
              </div>
              <p class="h6 text-neutral-900 text-start text-md-end">NT$2,600</p>
            </div>
          </div>
          <div class="d-flex section-lined mb-32">
                  <img src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week2/product-4.png?raw=true" alt="product-4" class="detail-img me-16 mb-32">
                  <div class="w-100">
                  <p class="h5 h6-md mb-8 like-detail">BOOMLOK</p>
                  <div class="d-flex">
                    <ul class="md sm text-neutral-600 me-12">
                      <li class="mb-8">尺寸</li>
                      <li class="mb-8">顏色</li>
                    </ul>
                    <ul class="md sm text-neutral-900">
                      <li class="mb-8">38</li>
                      <li>White</li>
                    </ul>
                  </div>
                  <p class="h6 text-neutral-900 text-start text-md-end">NT$3,200</p>
                  </div>
          </div>
          <div class="d-flex section-lined mb-32">
                  <img src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week2/product-3.png?raw=true" alt="product-3" class="detail-img me-16 mb-32">
                  <div class="w-100">
                  <p class="h5 h6-md mb-8 like-detail">MELTY KISS</p>
                  <div class="d-flex">
                    <ul class="md sm text-neutral-600 me-12">
                      <li class="mb-8">尺寸</li>
                      <li class="mb-8">顏色</li>
                    </ul>
                    <ul class="md sm text-neutral-900">
                      <li class="mb-8">38</li>
                      <li>Violet</li>
                    </ul>
                  </div>
                  <p class="h6 text-neutral-900 text-start text-md-end">NT$4,000</p>
                  </div>
          </div>
          <div class="d-flex justify-center mb-md-24">
            <button type="button" class="btn btn-dark">立即預約門市試穿</button>
          </div>
        </div>
      </div>
    </main>

    <%- include('./layout/footer'); -%>

    <script type="module" src="../main.js"></script>
  </body>
</html>
